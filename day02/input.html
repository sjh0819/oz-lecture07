<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Input</title>
     <!-- 내부스타일 -->
    <style>
      input[type="email"] {
        background-color: blue;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Input 실습</h1>
    <form action="/signup" method="get">
      <label for="userid">아이디</label>
      <input
        type="text"
        id="userid"
        name="userid"
        placeholder="영문과 숫자 4자 이상"
        value="my-id"
      />
      <div>
        <h2>Type 연습</h2>
        <input type="email" name="user-email" />
        <input type="number" name="age" />
        <input type="date" name="birth" />
        <input type="range" name="slider" />
        <input type="color" name="user-color" />
      </div>
      <div>
        <h2>여러 선택지 제공</h2>
        <div>
          <h3>checkbox - 여러개를 함께 고를 때</h3>
          <input type="checkbox" id="tos" name="agree" value="tos" />
          <label for="tos">이용약관에 동의합니다</label>
          <input type="checkbox" id="mail" name="mail" value="yes" />
          <label for="mail">메일 수신에 동의합니다</label>
        </div>
        <div>
          <h3>radio - 여럿 중 하나만 고를 때</h3>
          <p>요금제를 선택하세요</p>
          <input type="radio" id="free" name="plan" value="free" />
          <label for="free">무료</label>
          <input type="radio" id="pro" name="plan" value="pro" />
          <label for="pro">유료</label>
        </div>
        <div>
          <h3>select - 목록에서 하나를 고를 때</h3>
          <label for="city">지역</label>
          <select id="city" >
            <option value="">선택하세요</option>
            <option value="seoul">서울</option>
            <option value="deagu">대구</option>
            <option value="jeonju">전주</option>
            <option value="busan">부산</option>
          </select>
          <div>
          <h3>checkbox 여러개 선택</h3>
            <input type="checkbox" id="hobbit-swim" name="hobbit" value="swim" />
            <label for="hobbit-swim">수영</label>
            <input type="checkbox" id="hobbit-A" name="hobbit" value="A" />
            <label for="hobbit-A">등산</label>
            <input type="checkbox" id="hobbit-B" name="hobbit" value="B" />
            <label for="hobbit-B">악기</label>
            <input type="checkbox" id="hobbit-C" name="hobbit" value="C" />
            <label for="hobbit-C">산책</label>
        </div>
        </div>
      </div>
      <hr />
      <label for=""intro">자기소개</label>
      <text area
      <button type="submit">가입</button>
    </form>
  </body>
</html>
